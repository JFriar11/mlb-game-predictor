[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mlb-game-predictor"
version = "0.1.0"
description = "Leakage-controlled MLB pregame forecasting foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.8,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
mlb-predictor = "mlb_predictor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlb_predictor"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

