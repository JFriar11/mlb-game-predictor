[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mlb-game-predictor"
version = "0.1.0"
description = "Leakage-controlled MLB pregame forecasting foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<1",
  "tenacity>=9,<10",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.8,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
mlb-predictor = "mlb_predictor.cli:main"
mlb-predictor-api = "mlb_predictor.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlb_predictor"]

[tool.hatch.build.targets.wheel.force-include]
"config/sprint0_games.json" = "mlb_predictor/resources/sprint0_games.json"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["postgres: isolated PostgreSQL acceptance tests (opt-in)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
