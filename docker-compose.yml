services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mlb_predictor
      POSTGRES_USER: mlb
      POSTGRES_PASSWORD: mlb
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlb -d mlb_predictor"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - mlb_postgres_data:/var/lib/postgresql/data

volumes:
  mlb_postgres_data:

