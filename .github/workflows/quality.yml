name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npx playwright install --with-deps --no-shell chromium
      - run: npm run build
      - run: npm test

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt
      - if: matrix.python-version == '3.11'
        run: python -m pip install -e '.[dev]'
      - if: matrix.python-version == '3.12'
        run: |
          python -m pip install -r requirements/dev.txt -r requirements/build.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
        env:
          LOKY_MAX_CPU_COUNT: '1'
      - run: mlb-predictor --help

  postgres-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.txt
      - run: |
          python -m pip install -r requirements/dev.txt -r requirements/build.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - run: python scripts/runtime_acceptance.py
      - run: docker build -t mlb-predictor:ci .
      - run: docker run --rm mlb-predictor:ci --help
      - run: >-
          docker run --rm --entrypoint python mlb-predictor:ci -c
          'from mlb_predictor.cli import _load_sprint0_ids; assert len(_load_sprint0_ids()) == 5'
      - run: >-
          docker run --rm --entrypoint python mlb-predictor:ci -c
          'import shutil; from mlb_predictor.api.app import create_app;
          assert len(create_app().openapi()["paths"]) == 5;
          assert shutil.which("mlb-predictor-api")'

  infrastructure-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl --fail --location --retry 3 https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64 --output "$RUNNER_TEMP/bicep"
          chmod +x "$RUNNER_TEMP/bicep"
          "$RUNNER_TEMP/bicep" build infra/azure/app.bicep --outfile "$RUNNER_TEMP/app.compiled.json"
          python3 scripts/check_infra.py "$RUNNER_TEMP/app.compiled.json"
